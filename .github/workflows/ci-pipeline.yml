name: CI

on: [push, pull_request]

jobs:
  multitest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - if: matrix.os == 'ubuntu-latest'
        name: install audio library libsndfile
        run: sudo apt-get -y update && sudo apt-get install -y libsndfile1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Install requirements
        run: |
          poetry install --no-interaction
          poetry run pip install torch torchvision torchaudio
      - name: Test with pytest
        run: poetry run pytest test
        env:
            CI: true

  coverage:
    needs: multitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install audio library libsndfile
        run: sudo apt-get -y update && sudo apt-get install -y libsndfile1
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Generate coverage report
        run: |
          poetry install --no-interaction
          poetry run pip install torch torchvision torchaudio
          poetry run coverage run -m pytest test
          poetry run coverage xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4

  documentation:
    needs: multitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install audio library libsndfile
        run: sudo apt-get -y update && sudo apt-get install -y libsndfile1
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Install dependencies
        run: |
          poetry install --no-interaction
          poetry run pip install torch torchvision torchaudio
      - name: Build documentation
        run: cd docs && make clean && make html # Use SPHINXOPTS="-W" to fail on warning.

  build-and-publish:
    needs: documentation
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install audio library libsndfile
        run: sudo apt-get -y update && sudo apt-get install -y libsndfile1
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Build a binary wheel and a source tarball
        env:
          PASSWORD: ${{ secrets.PYPI_DEPLOYMENT }}
        run: poetry publish --build --skip-existing --password $PASSWORD
      - name: Github release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
