[project]
name = "tonic"
version = "1.6.0"
description = "Event datasets and transforms."
authors = [
    {name = "The Neuromorphs of Telluride",email = "mail@lenzgregor.com"}
]
license = { text = "GNU GPLv3" }
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]
readme = "README.md"

requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy (<2.0.0)",
    "h5py (>=3.14.0,<4.0.0)",
    "importrosbag (>=1.0.4)",
    "scipy (>=1.16.0,<2.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "typing-extensions (>=4.14.0,<5.0.0)",
    "librosa (>=0.11.0,<0.12.0)",
    "pbr (>=6.1.1,<7.0.0)",
    "expelliarmus (>=1.1.12,<2.0.0)"
]

[project.urls]
repository = "https://github.com/neuromorphs/tonic"
documentation = "https://tonic.readthedocs.org"

[tool.poetry]

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
coverage = "^7.9.1"
matplotlib = "^3.10.3"
hdf5plugin = "^5.1.0"
imageio = "^2.37.0"
aedat = "^2.2.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
